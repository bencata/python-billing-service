version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: billing_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build: .
    container_name: billing_web
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/billing.db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    volumes:
      - shared_db_data:/data
    depends_on:
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: .
    container_name: billing_worker
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/billing.db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    volumes:
      - shared_db_data:/data
    depends_on:
      - redis
    command: celery -A app.worker.celery_app worker --loglevel=info

volumes:
  redis_data:
  shared_db_data:
